[dataset]
sample_rate = 12000            # IQ sample rate (Hz) — all signals synthesized at this rate
window_length = 2048           # Samples per training window (~170 ms at 12 kHz)
output_dir = "./output"
seed = 42
workers = 0                    # 0 = auto (CPU count); fallback for generators without own workers
# domains = ["narrowband"]     # Which domains to generate: "narrowband", "moderate", "wideband"

[impairments]
snr_levels = [25, 20, 15, 10, 5, 0, -5, -10]  # dB; samples distributed evenly across levels
max_freq_offset = 500          # Hz — max carrier offset applied in scenarios (RTL-SDR realistic)
window_stride = 0              # 0 = auto (window_length // 2); controls extraction overlap
window_power_threshold = 0.001 # windows below this mean power are discarded as silence

[impairments.scenarios]
# Relative weights (auto-normalized) for propagation/receiver scenario selection
hf_clean = 0.07
hf_good = 0.16
hf_poor = 0.16
vhf_mobile = 0.08
uhf_urban = 0.04
sdr_desktop = 0.08
contest_crowded = 0.08
overdriven = 0.04
poorly_operated = 0.04
vintage = 0.03
near_far = 0.02
auroral = 0.02
# Sprint 4 — multi-domain scenarios
indoor_multipath = 0.04
leo_satellite = 0.03
automotive = 0.02
urban_cellular = 0.03
radar_clutter = 0.02
maritime = 0.02
ism_congested = 0.02

[generators.synthetic]
enabled = true
samples_per_class = 9600
classes = "all"
# rsid_probability = 0.35      # Probability of prepending RSID preamble to synthetic segments
# cw_wpm_range = [10, 30]      # CW words-per-minute range [min, max]

[generators.synthetic.boost]
PSK31 = 2.0
PSK63 = 2.0
MFSK16 = 3.0
MFSK32 = 3.0

[generators.fldigi]
enabled = true
samples_per_class = 6000
workers = 14

[generators.wsjtx]
enabled = true
samples_per_class = 6000
# messages_per_mode = 200      # Messages to encode per WSJT-X mode (more = more diversity)

[generators.analog]
enabled = true
samples_per_class = 6000
utterances_per_class = 100
voice_cache = "./piper-voices"

[generators.sstv]
enabled = true
samples_per_class = 6000
# images_per_mode = 10         # Images to render per SSTV sub-mode (more = more diversity)

[generators.packet]
enabled = true
samples_per_class = 6000
# packets_per_baud = 100       # Packets generated per baud rate (more = more diversity)

[generators.digivoice]
enabled = true
samples_per_class = 6000
utterances_per_class = 120
voice_cache = "./piper-voices"
# codec2_mode = "3200"                             # Codec2 bitrate for tier-2 voice (1200/1300/1400/1600/2400/3200)
# freedv_modes = ["1600", "700C", "700D", "700E"]  # FreeDV sub-modes to generate

[generators.cw]
enabled = false                # opt-in: overlaps synthetic/fldigi CW; uses ebook2cw CLI
samples_per_class = 6000
# cw_wpm_range = [10, 35]     # WPM range for ebook2cw
# cw_tone_range = [400, 800]  # Tone frequency range (Hz)

[generators.msk144]
enabled = false                # opt-in: requires msk144gensim CLI
samples_per_class = 6000
# messages_per_mode = 200

[generators.minimodem]
enabled = false                # opt-in: RTTY overlaps synthetic/fldigi; uses minimodem CLI
samples_per_class = 6000
# minimodem_modes = ["rtty", "bell103", "bell202"]

[generators.sameeas]
enabled = false                # opt-in: requires sameeas Python package
samples_per_class = 6000

[generators.ardop]
enabled = false                # opt-in: requires ardopcf TNC
samples_per_class = 6000
# ardop_speeds = [200, 500, 1000, 2000]

[generators.js8call]
enabled = false                # opt-in: requires js8call + xvfb + pulseaudio
samples_per_class = 6000

[generators.op25]
enabled = false                # opt-in: requires OP25 dv_tx.py + mbelib
samples_per_class = 6000
utterances_per_class = 100
voice_cache = "./piper-voices"

[generators.hacktv]
enabled = false                # opt-in: requires hacktv CLI
samples_per_class = 6000

# --- Multi-domain generators ---

[generators.synthetic_moderate]
enabled = true
samples_per_class = 2000
# classes = "all"              # Or a list: ["BLE", "ADS_B", "GSM_BURST"]

[generators.synthetic_wideband]
enabled = true
samples_per_class = 1000
# classes = "all"              # Or a list: ["WIFI_PREAMBLE", "LTE_FRAME"]
