[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rf-datagen"
version = "1.0.0"
description = "RF signal IQ dataset generator for ML training — 39 amateur radio signal classes with realistic channel impairments"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "pysstv>=0.5",
]

[project.optional-dependencies]
qc = ["matplotlib>=3.6"]

[project.scripts]
rf-datagen = "rf_datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
