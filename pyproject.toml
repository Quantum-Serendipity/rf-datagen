[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-datagen"
version = "1.0.0"
description = "RF signal IQ dataset generator for ML training — 90 RF signal classes across narrowband, moderate, and wideband domains with realistic channel impairments"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "pysstv>=0.5",
]

[project.optional-dependencies]
qc = ["matplotlib>=3.6"]
gnuradio = ["gnuradio>=3.10"]
sdc = ["scikit-dsp-comm>=2.0"]
accel = ["sdr>=0.0.10"]
ml-validate = ["torch>=2.0", "torchsig>=0.4", "onnxruntime>=1.15"]
ml-validate-keras = ["tensorflow-cpu>=2.13"]
ml-validate-rfml = ["rfml>=1.0"]

[project.scripts]
rf-datagen = "rf_datagen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
